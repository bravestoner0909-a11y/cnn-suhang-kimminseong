name: Supabase DB Keep Alive

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Call Supabase Postgres REST API
        run: |
          curl -sS -f -X GET "${SUPABASE_URL}/rest/v1/keepalive_ping?select=id,last_seen&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
